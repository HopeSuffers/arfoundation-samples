name: Unity iOS Build & TestFlight Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  buildForiOSPlatform:
    name: Build iOS (Unity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-iOS-${{ runner.os }}-
            Library-iOS-

      - name: Build iOS with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: iOS

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-iOS
          path: build/iOS

  releaseToTestFlight:
    name: Release to TestFlight
    runs-on: macos-latest
    needs: buildForiOSPlatform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download iOS Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-iOS
          path: build/iOS

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install dependencies & run fastlane
        env:
          # Apple / App Store
          APPLE_CONNECT_EMAIL: ${{ secrets.APPLE_CONNECT_EMAIL }}
          APPLE_DEVELOPER_EMAIL: ${{ secrets.APPLE_DEVELOPER_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # fastlane match
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

          # App Store Connect API Key
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}

          # Unity / iOS metadata
          IOS_BUILD_PATH: ${{ github.workspace }}/build/iOS
          IOS_BUNDLE_ID: com.ach.arfoundation.samples
          PROJECT_NAME: AR Foundation Samples GameCI

          CI: "true"

        run: |
          xcodebuild -downloadPlatform iOS

          eval "$(ssh-agent -s)"
          ssh-add - <<< "${MATCH_DEPLOY_KEY}"

          find "$IOS_BUILD_PATH" -type f -name "*.sh" -exec chmod +x {} \;
          find "$IOS_BUILD_PATH" -type f -iname "usymtool*" -exec chmod +x {} \;

          bundle install
          bundle exec fastlane ios beta

      - name: Cleanup artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v2
        with:
          name: build-iOS
